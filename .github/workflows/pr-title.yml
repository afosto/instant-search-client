# PR titles follow the branch name (`Fix/...`, `Feature/...`), which becomes the squash commit on master.
name: PR title

on:
  # pull_request_target can edit the title of PRs from forks. It runs the workflow and commitlint
  # config from master, and never checks out the PR code.
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  branch-name:
    runs-on: ubuntu-latest
    if: >-
      !startsWith(github.head_ref, 'changeset-release/') &&
      !startsWith(github.head_ref, 'dependabot/') &&
      !startsWith(github.head_ref, 'renovate/')
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the branch name
        run: echo "$BRANCH" | pnpm exec commitlint --verbose
        env:
          BRANCH: ${{ github.head_ref }}
      - name: Use the branch name as PR title
        if: github.event.pull_request.title != github.head_ref
        run: gh pr edit "$NUMBER" --repo "$REPO" --title "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
